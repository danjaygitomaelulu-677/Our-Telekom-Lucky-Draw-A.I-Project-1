  <!-- Application Core Script -->
  <script>
    // App State Management
    let currentMode = 'range'; // 'range' | 'custom'
    let drawnWinners = [];
    let isAudioEnabled = true;
    let isSpinning = false;
    let audioContext = null;

    // Initialize Lucide Icons
    lucide.createIcons();

    // Sound Synthesizer setup using Web Audio API (No external sound files required)
    function initAudio() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playTickSound() {
      if (!isAudioEnabled) return;
      try {
        initAudio();
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(300 + Math.random() * 150, audioContext.currentTime);
        gain.gain.setValueAtTime(0.05, audioContext.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.04);
        osc.connect(gain);
        gain.connect(audioContext.destination);
        osc.start();
        osc.stop(audioContext.currentTime + 0.04);
      } catch (e) {
        // Fallback or ignore audio context restrictions on mobile user interaction
      }
    }

    function playWinSound() {
      if (!isAudioEnabled) return;
      try {
        initAudio();
        const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
        notes.forEach((freq, idx) => {
          const osc = audioContext.createOscillator();
          const gain = audioContext.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, audioContext.currentTime + idx * 0.1);
          gain.gain.setValueAtTime(0.15, audioContext.currentTime + idx * 0.1);
          gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + idx * 0.1 + 0.3);
          osc.connect(gain);
          gain.connect(audioContext.destination);
          osc.start(audioContext.currentTime + idx * 0.1);
          osc.stop(audioContext.currentTime + idx * 0.1 + 0.3);
        });
      } catch (e) {}
    }

    function toggleAudio() {
      isAudioEnabled = !isAudioEnabled;
      const soundBtn = document.getElementById('soundIcon');
      if (isAudioEnabled) {
        soundBtn.setAttribute('data-lucide', 'volume-2');
        soundBtn.classList.remove('text-gray-500');
        soundBtn.classList.add('text-cyan-400');
        showToast("Audio Sounds Enabled");
      } else {
        soundBtn.setAttribute('data-lucide', 'volume-x');
        soundBtn.classList.remove('text-cyan-400');
        soundBtn.classList.add('text-gray-500');
        showToast("Audio Sounds Muted");
      }
      lucide.createIcons();
    }

    function switchMode(mode) {
      if (isSpinning) return;
      currentMode = mode;
      
      const tabRange = document.getElementById('tabRange');
      const tabCustom = document.getElementById('tabCustom');
      const rangeInputs = document.getElementById('rangeInputs');
      const customInputs = document.getElementById('customInputs');

      if (mode === 'range') {
        tabRange.className = 'flex-1 py-2.5 px-4 rounded-xl text-sm font-semibold transition flex items-center justify-center gap-2 bg-cyan-600 text-white shadow-md';
        tabCustom.className = 'flex-1 py-2.5 px-4 rounded-xl text-sm font-semibold transition flex items-center justify-center gap-2 text-gray-400 hover:text-white';
        rangeInputs.classList.remove('hidden');
        customInputs.classList.add('hidden');
      } else {
        tabCustom.className = 'flex-1 py-2.5 px-4 rounded-xl text-sm font-semibold transition flex items-center justify-center gap-2 bg-cyan-600 text-white shadow-md';
        tabRange.className = 'flex-1 py-2.5 px-4 rounded-xl text-sm font-semibold transition flex items-center justify-center gap-2 text-gray-400 hover:text-white';
        customInputs.classList.remove('hidden');
        rangeInputs.classList.add('hidden');
      }
      updatePoolCount();
    }

    function getItemsPool() {
      if (currentMode === 'range') {
        const min = parseInt(document.getElementById('minNum').value) || 0;
        const max = parseInt(document.getElementById('maxNum').value) || 0;
        if (min > max) return [];
        let items = [];
        for (let i = min; i <= max; i++) {
          items.push(i.toString());
        }
        return items;
      } else {
        const text = document.getElementById('customListText').value;
        return text
          .split(/[\n,]+/)
          .map(item => item.trim())
          .filter(item => item.length > 0);
      }
    }

    function updatePoolCount() {
      const pool = getItemsPool();
      document.getElementById('poolCountDisplay').innerText = pool.length;
    }

    // Attach Input Event Listeners
    document.getElementById('minNum').addEventListener('input', updatePoolCount);
    document.getElementById('maxNum').addEventListener('input', updatePoolCount);
    document.getElementById('customListText').addEventListener('input', updatePoolCount);

    function startDraw() {
      if (isSpinning) return;

      const pool = getItemsPool();
      const allowDuplicates = document.getElementById('allowDuplicates').checked;

      if (pool.length === 0) {
        showToast("Error: Pool is empty! Adjust inputs.");
        return;
      }

      // Filter remaining items if duplicates are not allowed
      let availablePool = pool;
      if (!allowDuplicates) {
        const drawnValues = drawnWinners.map(w => w.value);
        availablePool = pool.filter(item => !drawnValues.includes(item));
      }

      if (availablePool.length === 0) {
        showToast("All eligible numbers/items have been drawn!");
        return;
      }

      // Start Spin Animation UI
      isSpinning = true;
      const spinBtn = document.getElementById('spinBtn');
      const winnerText = document.getElementById('winnerText');

      spinBtn.disabled = true;
      spinBtn.classList.remove('btn-pulse');
      spinBtn.classList.add('opacity-50', 'cursor-not-allowed');
      winnerText.classList.add('blur-motion');

      let spinCount = 0;
      const totalSpins = 35; // Number of fast shuffles
      let intervalSpeed = 40; // ms

      function step() {
        // Pick random temporary item for fast scrolling effect
        const randomTemp = availablePool[Math.floor(Math.random() * availablePool.length)];
        winnerText.innerText = randomTemp;
        playTickSound();

        spinCount++;
        if (spinCount < totalSpins) {
          // Slow down progressively towards the end
          if (spinCount > totalSpins - 10) {
            intervalSpeed += 25;
          }
          setTimeout(step, intervalSpeed);
        } else {
          // Final Winner Picked
          const winnerValue = availablePool[Math.floor(Math.random() * availablePool.length)];
          finishDraw(winnerValue);
        }
      }

      step();
    }

    function finishDraw(winner) {
      const winnerText = document.getElementById('winnerText');
      const spinBtn = document.getElementById('spinBtn');

      winnerText.classList.remove('blur-motion');
      winnerText.innerText = winner;

      // Golden win glow effect
      winnerText.className = "number-font text-5xl sm:text-7xl font-black text-amber-400 tracking-tight glow-gold transition-all scale-105";

      playWinSound();
      triggerConfetti();

      // Add to History state
      const timestamp = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      drawnWinners.unshift({ value: winner, time: timestamp });

      updateHistoryUI();

      // Reset Button State
      setTimeout(() => {
        spinBtn.disabled = false;
        spinBtn.classList.remove('opacity-50', 'cursor-not-allowed');
        spinBtn.classList.add('btn-pulse');
        winnerText.className = "number-font text-5xl sm:text-7xl font-black text-cyan-400 tracking-tight glow-cyan transition-all";
        isSpinning = false;
      }, 1200);
    }

    function triggerConfetti() {
      if (typeof confetti === 'function') {
        confetti({
          particleCount: 100,
          spread: 70,
          origin: { y: 0.6 }
        });
      }
    }

    function updateHistoryUI() {
      const historyList = document.getElementById('historyList');
      const emptyMsg = document.getElementById('emptyHistoryMsg');
      const countBadge = document.getElementById('winnerCountBadge');
      const mobileBadge = document.getElementById('mobileBadge');

      countBadge.innerText = drawnWinners.length;
      mobileBadge.innerText = drawnWinners.length;
      if (drawnWinners.length > 0) mobileBadge.classList.remove('hidden');

      if (drawnWinners.length === 0) {
        historyList.innerHTML = '';
        historyList.appendChild(emptyMsg);
        return;
      }

      // Build updated list HTML
      historyList.innerHTML = drawnWinners.map((item, index) => `
        <div class="bg-gray-950 border border-gray-800 rounded-xl p-3 flex items-center justify-between text-sm animate-fade-in">
          <div class="flex items-center gap-3">
            <span class="w-6 h-6 rounded-full bg-cyan-950 text-cyan-400 border border-cyan-800/60 font-bold text-xs flex items-center justify-center">
              #${drawnWinners.length - index}
            </span>
            <span class="font-extrabold text-white number-font text-base">${item.value}</span>
          </div>
          <span class="text-[11px] text-gray-500">${item.time}</span>
        </div>
      `).join('');
    }

    function clearHistory() {
      if (drawnWinners.length === 0) return;
      if (confirm("Clear all recorded winners?")) {
        drawnWinners = [];
        updateHistoryUI();
        document.getElementById('mobileBadge').classList.add('hidden');
        showToast("History cleared.");
      }
    }

    function copyWinners() {
      if (drawnWinners.length === 0) {
        showToast("No winners to copy!");
        return;
      }
      const textToCopy = drawnWinners.map((w, idx) => `${drawnWinners.length - idx}. ${w.value} (${w.time})`).join('\n');
      
      // Copy to clipboard fallback
      const tempArea = document.createElement('textarea');
      tempArea.value = textToCopy;
      document.body.appendChild(tempArea);
      tempArea.select();
      document.execCommand('copy');
      document.body.removeChild(tempArea);

      showToast("Winners copied to clipboard!");
    }

    function toggleHistorySidebar() {
      const sidebar = document.getElementById('historySidebar');
      const overlay = document.getElementById('sidebarOverlay');
      
      sidebar.classList.toggle('translate-x-full');
      overlay.classList.toggle('hidden');
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      toastMsg.innerText = message;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      
      setTimeout(() => {
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 2500);
    }

    // Initialize Pool Count on Load
    updatePoolCount();
  </script>
</body>
</html>
